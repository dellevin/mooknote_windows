<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MookNote 阅读器</title>
<style>
  html { height: 100vh; overflow: hidden; }
  html, body { height: 100vh; overflow: hidden; }
  body { user-select: none; margin: 0 !important; }

  #footnote-dialog {
    position: fixed;
    width: 80vw;
    height: 80vh;
    max-width: 600px;
    max-height: 360px;
    min-width: 300px;
    min-height: 200px;
    border-radius: 12px;
    border: 1px solid grey;
    user-select: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    outline: none;
    z-index: 1000;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.92);
  }
  #footnote-dialog main { overflow: auto; width: 100%; height: 100%; padding: 12px 16px; }
</style>

<div id="footnote-dialog">
  <main></main>
</div>

<script>
  // foliate-js（book.js）通过 window.flutter_inappwebview.callHandler(name, data) 与宿主通信。
  // Electron 下桥接到 preload 暴露的 window.mook.readerHost；主窗口/未注入时降级为 console。
  window.flutter_inappwebview = {
    callHandler(name, data) {
      try {
        window.mook?.readerHost?.event(name, data)
      } catch (e) {
        console.warn('readerHost event failed', name, e)
      }
    }
  }
  document.addEventListener('contextmenu', (e) => e.preventDefault())
</script>

<script>
  // 与 anx-reader 的 index.html 一致：Chromium >= 100 直接加载 ES module 源码，
  // 否则加载 webpack 打包产物（本项目未引入 dist，Electron 33 内置 Chromium 130，走现代分支即可）。
  const loadScript = (src, options = {}) => new Promise((resolve, reject) => {
    const script = document.createElement('script')
    script.src = src
    if (options.type) script.type = options.type
    script.onload = () => resolve()
    script.onerror = (err) => { console.error('Failed to load script', src, err); reject(err) }
    document.head.appendChild(script)
  })

  ;(async () => {
    // 宿主控制层（书架/目录/书签/设置）先加载并注册事件，再加载 foliate 运行时
    await loadScript('./reader-app.js', { async: false })
    await loadScript('./foliate/vendor/pdfjs/pdf.js', { async: false, defer: false })
    await loadScript('./foliate/book.js', { type: 'module' })
  })()
</script>
